name: Deploy Static Site

on:
  push:
    branches: ["main"] # Triggers on push to the main branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # OPTIONAL: If your project needs a build step (e.g., React/Vite), uncomment below:
      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change to "dist" or "build" if using a build framework
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
